<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ee 工作台</title>
<style>
/* ═══════════════ DESIGN SYSTEM ═══════════════ */
:root{
  --bg:#FAF9F7;--bg-alt:#F5F4F1;--card:#FFFFFF;--card-alt:#F9F8F6;
  --text:#1A1A1A;--t2:#6B6B6B;--t3:#A0A0A0;--border:#EBE9E5;
  --accent:#3B82F6;--accent-light:#EFF6FF;--accent-hover:#2563EB;
  --green:#059669;--green-light:#ECFDF5;
  --warn:#DC2626;--warn-light:#FEF2F2;
  --amber:#D97706;--amber-light:#FFFBEB;
  --hl:#FFF7ED;
  --r:20px;--rs:12px;--rl:24px;
  --sh-sm:0 1px 2px rgba(0,0,0,.04);
  --sh:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 12px rgba(0,0,0,.06);
  --sh-lg:0 8px 24px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;
  --sw:240px;--nav-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100dvh;letter-spacing:-0.01em}
body::before{content:'';position:fixed;inset:0;background:url(bg-desktop.jpg) center/cover no-repeat;z-index:-1;opacity:.35}
@media(max-width:768px){body::before{background-image:url(bg-mobile.jpg);opacity:.3}}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}

/* ═══════════════ LAYOUT ═══════════════ */
.app{display:flex;min-height:100dvh}

/* ── Top Bar ── */
.topbar{position:fixed;top:0;left:var(--sw);right:0;height:56px;background:rgba(250,249,247,.65);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.05);display:flex;align-items:center;padding:0 28px;z-index:90;gap:12px}
.topbar-date{font-size:13px;color:var(--t3);white-space:nowrap}
.topbar-search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:var(--card-alt);color:var(--t3);font-size:14px;cursor:text;transition:all .2s}
.topbar-search:hover,.topbar-search:focus-within{background:var(--card);box-shadow:var(--sh)}
.topbar-search input{border:none;background:none;outline:none;flex:1;font-size:14px;color:var(--text)}
.topbar-search input::placeholder{color:var(--t3)}
.topbar-search svg{width:16px;height:16px;opacity:.5}

/* ── Sidebar ── */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sw);background:rgba(245,244,241,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column;z-index:100;padding:0 12px;border-right:1px solid rgba(0,0,0,.05)}
.sb-user{display:flex;align-items:center;gap:10px;padding:20px 8px 16px}
.sb-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#E0E7FF,#C7D2FE);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#4F46E5;flex-shrink:0}
.sb-user-info{overflow:hidden}
.sb-user-name{font-size:14px;font-weight:600;color:var(--text)}
.sb-user-ws{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{flex:1;overflow-y:auto;padding:4px 0;display:flex;flex-direction:column;gap:1px}
.sb-sec{display:flex;flex-direction:column;gap:1px}
.sb-sec+.sb-sec{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.sb-label{font-size:10px;color:var(--t3);letter-spacing:.06em;padding:2px 10px 6px;font-weight:500}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--rs);color:var(--t2);transition:all .15s;font-size:13px;width:100%;text-align:left;font-weight:450}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:var(--card);color:var(--text);font-weight:550;box-shadow:var(--sh-sm)}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1;color:var(--accent)}
.nav-item .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;padding:1px 7px;border-radius:999px;font-weight:500;min-width:20px;text-align:center}
.sb-footer{padding:12px 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:1px}

/* ── Main ── */
.main{flex:1;margin-left:var(--sw);padding:72px 36px 48px;width:100%;max-width:100%}
.page{display:none;animation:pgIn .3s ease-out}
.page.active{display:block}
@keyframes pgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.pg-hd{margin-bottom:28px}
.pg-title{font-size:28px;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px;color:var(--text)}
.pg-sub{font-size:14px;color:var(--t3);line-height:1.5;max-width:560px}

/* ═══════════════ COMPONENTS ═══════════════ */

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:500;transition:all .2s;letter-spacing:-0.01em}
.btn-p{background:var(--text);color:#fff}
.btn-p:hover{background:#333;transform:translateY(-1px);box-shadow:var(--sh-md)}
.btn-s{background:var(--card);color:var(--text);box-shadow:var(--sh-sm)}
.btn-s:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.btn-g{color:var(--t2)}.btn-g:hover{background:var(--bg);color:var(--text)}
.btn-d{color:var(--warn)}.btn-d:hover{background:var(--warn-light)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn-icon{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;color:var(--t2);transition:all .15s}
.btn-icon:hover{background:var(--bg);color:var(--text)}

/* ── Cards ── */
.card{background:rgba(255,255,255,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:var(--rl);padding:22px;box-shadow:var(--sh);transition:all .2s;border:1px solid rgba(255,255,255,.4)}
.card:hover{box-shadow:var(--sh-md);background:rgba(255,255,255,.7)}
.card+.card{margin-top:12px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;letter-spacing:-0.01em}
.card-subtitle{font-size:12px;color:var(--t3)}

/* ── Tags ── */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:500}
.tag-g{background:var(--green-light);color:var(--green)}
.tag-w{background:var(--warn-light);color:var(--warn)}
.tag-b{background:var(--accent-light);color:var(--accent)}
.tag-d{background:var(--bg);color:var(--t3)}

/* ── Forms ── */
.fg{margin-bottom:16px}
.fl{display:block;font-size:12px;font-weight:500;margin-bottom:4px;color:var(--t2);letter-spacing:-0.01em}
.fi,.ft,.fs{width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,.4);border-radius:var(--rs);background:rgba(255,255,255,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--text);transition:all .15s;font-size:14px}
.fi:focus,.ft:focus,.fs:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);background:rgba(255,255,255,.75)}
.ft{resize:vertical;min-height:80px;line-height:1.6}

/* ── Checkbox ── */
.cb-row{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;transition:all .15s}
.cb-row:hover{opacity:.8}
.cb-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--text);cursor:pointer}
.cb-done{text-decoration:line-through;color:var(--t3)}

/* ── Empty State ── */
.empty{text-align:center;padding:48px 24px;color:var(--t3)}
.empty-title{font-size:15px;color:var(--t2);margin-bottom:4px;font-weight:500}
.empty-desc{font-size:12px}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fi .2s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:var(--rl);padding:28px;width:92%;max-width:520px;max-height:85vh;overflow-y:auto;box-shadow:var(--sh-lg);animation:su .25s ease-out;border:1px solid rgba(255,255,255,.5)}
.modal-title{font-size:18px;font-weight:700;margin-bottom:20px;letter-spacing:-0.02em}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:24px}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── Toast ── */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 22px;border-radius:999px;font-size:13px;z-index:2000;animation:su .25s ease-out;box-shadow:var(--sh-lg);letter-spacing:-0.01em}

/* ── Floating AI Button ── */
.fab-ai{position:fixed;bottom:32px;right:32px;width:52px;height:52px;border-radius:50%;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-lg);z-index:150;transition:all .3s;cursor:pointer}
.fab-ai:hover{transform:scale(1.08);box-shadow:0 12px 32px rgba(0,0,0,.15)}
.fab-ai:active{transform:scale(.95)}
.fab-ai svg{width:22px;height:22px}

/* ── Help ── */
.btn-help{width:20px;height:20px;border-radius:50%;background:var(--bg);color:var(--t3);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border:1px solid var(--border);cursor:help;position:relative;flex-shrink:0;vertical-align:middle;transition:all .15s}
.btn-help:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.help-pop{position:fixed;background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--rs);font-size:12px;line-height:1.6;z-index:3000;max-width:280px;box-shadow:var(--sh-lg)}

/* ── Stat Cards ── */
.stat-card{background:rgba(255,255,255,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:var(--rl);padding:20px;text-align:center;box-shadow:var(--sh);transition:all .2s;border:1px solid rgba(255,255,255,.35)}
.stat-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px);background:rgba(255,255,255,.7)}
.stat-val{font-size:28px;font-weight:700;color:var(--text);letter-spacing:-0.03em}
.stat-label{font-size:11px;color:var(--t3);margin-top:6px;font-weight:450}

/* ── Search (global page) ── */
.search-wrap{position:relative;margin-bottom:24px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--t3);opacity:.5}
.search-inp{width:100%;padding:14px 14px 14px 44px;border:1px solid rgba(255,255,255,.5);border-radius:var(--rl);background:rgba(255,255,255,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:16px;box-shadow:var(--sh-sm);transition:all .2s}
.search-inp:focus{outline:none;box-shadow:var(--sh);background:rgba(255,255,255,.75)}

/* ── Progress ── */
.prog-wrap{height:4px;background:var(--bg);border-radius:2px;margin-top:8px;overflow:hidden}
.prog-bar{height:100%;background:var(--text);border-radius:2px;transition:width .4s ease-out}

/* ── Section label ── */
.section-label{font-size:11px;color:var(--t3);letter-spacing:.05em;margin-bottom:10px;margin-top:24px;padding-left:4px;font-weight:500}

/* ── Status dot ── */
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.status-dot.green{background:var(--green)}.status-dot.orange{background:var(--amber)}.status-dot.gray{background:var(--t3)}

/* ── Tabs ── */
.tabs{display:flex;gap:2px;margin-bottom:20px}
.tab-btn{padding:8px 18px;font-size:13px;color:var(--t3);border-radius:999px;transition:all .15s;font-weight:500}
.tab-btn:hover{color:var(--text);background:var(--bg)}
.tab-btn.active{color:var(--text);background:var(--card);box-shadow:var(--sh-sm)}

/* ── Chat ── */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 260px);min-height:400px}
.chat-msgs{flex:1;overflow-y:auto;padding:8px 0}
.chat-msg{margin-bottom:16px;max-width:80%}
.chat-msg.user{margin-left:auto}
.chat-msg.user .chat-bub{background:var(--text);color:#fff;border-radius:20px 20px 4px 20px}
.chat-msg.asst .chat-bub{background:rgba(255,255,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:20px 20px 20px 4px;box-shadow:var(--sh-sm);border:1px solid rgba(255,255,255,.3)}
.chat-bub{padding:12px 18px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.chat-row{display:flex;gap:8px;margin-top:12px}
.chat-inp{flex:1;padding:12px 18px;border:1px solid rgba(255,255,255,.5);border-radius:999px;background:rgba(255,255,255,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px;transition:all .15s}
.chat-inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);background:rgba(255,255,255,.75)}

/* ── Calendar ── */
.cal-wrap{margin-bottom:28px}
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.cal-nav-title{font-size:16px;font-weight:600;flex:1;letter-spacing:-0.01em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day-hd{text-align:center;padding:10px 4px;border-radius:var(--rs);font-size:11px;color:var(--t3)}
.cal-day-hd .dow{font-size:10px;letter-spacing:.04em}
.cal-day-hd .dom{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-0.02em}
.cal-day-hd.today{background:var(--text);color:#fff}
.cal-day-hd.today .dom{color:#fff}
.cal-day-hd.today .dow{color:rgba(255,255,255,.6)}
.cal-day-col{background:rgba(255,255,255,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:var(--rs);min-height:110px;padding:6px;display:flex;flex-direction:column;box-shadow:var(--sh-sm);transition:box-shadow .2s;border:1px solid rgba(255,255,255,.3)}
.cal-day-col:hover{box-shadow:var(--sh);background:rgba(255,255,255,.65)}
.cal-day-col.today{box-shadow:0 0 0 2px var(--text);background:rgba(255,255,255,.7)}
.cal-item{font-size:11px;padding:4px 8px;margin:1px 0;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .1s;line-height:1.3}
.cal-item:hover{filter:brightness(.95)}
.cal-item.done{opacity:.4;text-decoration:line-through}
.cal-item.type-meeting{background:#E0E7FF;color:#3730A3}
.cal-item.type-training{background:#EDE9FE;color:#5B21B6}
.cal-item.type-task{background:var(--green-light);color:var(--green)}
.cal-item.type-other{background:var(--hl);color:#9A3412}
.cal-day-add{font-size:10px;color:var(--t3);text-align:center;padding:4px;cursor:pointer;border-radius:6px;margin-top:auto;transition:all .15s}
.cal-day-add:hover{background:var(--bg);color:var(--text)}
.cal-recurring{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cal-recur-tag{font-size:10px;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--t2);display:flex;align-items:center;gap:4px;cursor:pointer;transition:all .15s}
.cal-recur-tag:hover{background:var(--card);box-shadow:var(--sh-sm)}

/* ── Market / Diet / Settings ── */
.market-item{display:flex;align-items:center;gap:14px;padding:16px 20px;background:rgba(255,255,255,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:var(--rl);margin-bottom:8px;box-shadow:var(--sh-sm);transition:all .15s;border:1px solid rgba(255,255,255,.35)}
.market-item:hover{box-shadow:var(--sh);background:rgba(255,255,255,.7)}
.set-sec{margin-bottom:28px}
.set-sec-title{font-size:16px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);letter-spacing:-0.01em}
.update-log-entry{padding:16px 0;border-bottom:1px solid var(--border)}
.update-log-date{font-size:11px;color:var(--accent);font-weight:500}
.update-log-version{font-size:16px;font-weight:700;margin:4px 0;letter-spacing:-0.01em}
.update-log-detail{font-size:13px;color:var(--t2);line-height:1.7}
.diet-history-item{padding:12px 16px;background:var(--card);border-radius:var(--rs);box-shadow:var(--sh-sm);margin-bottom:6px;cursor:pointer;font-size:13px;transition:all .15s}
.diet-history-item:hover{box-shadow:var(--sh)}
.meal-card{background:rgba(255,255,255,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh);margin-bottom:14px;border:1px solid rgba(255,255,255,.35)}
.meal-card-header{padding:18px 22px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(0,0,0,.05)}
.meal-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.meal-icon.breakfast{background:#FFF7ED}.meal-icon.lunch{background:var(--green-light)}.meal-icon.dinner{background:#EDE9FE}
.meal-name{font-size:16px;font-weight:600;letter-spacing:-0.01em}
.meal-body{padding:18px 22px}
.meal-steps{margin-top:10px;padding:14px;background:var(--bg);border-radius:var(--rs);font-size:13px;line-height:1.8}
.meal-total{text-align:center;padding:14px;font-size:14px;font-weight:600;border-top:1px solid var(--border);letter-spacing:-0.01em}

/* ── Gold ── */
.gold-hero{text-align:center;padding:24px 0}
.gold-price{font-size:48px;font-weight:700;color:#B8860B;letter-spacing:-0.03em}
.gold-sub{font-size:14px;color:var(--t2);margin-top:4px}
.gold-row{display:flex;justify-content:space-around;padding:14px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:13px}

/* ── Mood ── */
.mood-row{display:flex;gap:10px}
.mood-btn{width:42px;height:42px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .15s;cursor:pointer;background:var(--card)}
.mood-btn:hover,.mood-btn.sel{border-color:var(--text);background:var(--text);color:#fff}

/* ── Priority dot ── */
.p-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.p-high{background:var(--warn)}.p-mid{background:var(--amber)}.p-low{background:var(--t3)}

/* ── Settings ── */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.set-row-label{font-size:14px}
.set-row-desc{font-size:12px;color:var(--t3);margin-top:2px}

/* ── Inline tag ── */
.itag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;background:var(--bg);color:var(--t2);margin:3px}

/* ── Cal summary ── */
.cal-summary{font-size:13px;line-height:1.8;background:var(--bg);padding:16px;border-radius:var(--rs);color:var(--t2);white-space:pre-wrap}

/* ── Grid helpers ── */
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}

/* ═══════════════ MOBILE ═══════════════ */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.4);z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.mob-nav-inner{display:flex;height:var(--nav-h)}
.mob-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--t3);font-size:10px;transition:color .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.mob-nav-item.active{color:var(--text)}
.mob-nav-item svg{width:22px;height:22px}
.more-overlay{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:200;display:flex;align-items:flex-end;animation:fi .2s}
.more-menu{width:100%;background:var(--card);border-radius:var(--rl) var(--rl) 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0));animation:su .3s ease-out;max-height:75vh;overflow-y:auto}
.more-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.more-title{font-size:16px;font-weight:700;margin-bottom:16px}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.more-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:var(--r);background:var(--bg);font-size:12px;color:var(--t2);transition:all .15s;-webkit-tap-highlight-color:transparent}
.more-item:active{background:var(--card);color:var(--text);box-shadow:var(--sh)}

@media(min-width:1400px){
  .g2{grid-template-columns:repeat(3,1fr)}
  .g3{grid-template-columns:repeat(4,1fr)}
  .g4{grid-template-columns:repeat(5,1fr)}
}
@media(max-width:768px){
  .sidebar,.topbar{display:none}
  .main{margin-left:0;padding:20px 14px 110px;max-width:100%}
  .mob-nav{display:block}
  .fab-ai{bottom:80px;right:16px;width:46px;height:46px}
  .g2,.g3,.g4,.g5{grid-template-columns:1fr}
  .pg-title{font-size:24px}
  .chat-wrap{height:calc(100vh - 280px)}
  .modal{width:94%;padding:22px}
  .mood-btn{width:36px;height:36px;font-size:16px}
  .cal-grid{grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-day-col{min-height:70px;padding:2px}
  .cal-item{font-size:9px;padding:2px 3px}
  .cal-day-hd{padding:4px 2px}
  .cal-day-hd .dom{font-size:14px}
  .gold-price{font-size:32px}
}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}

/* ── Login ── */
.login-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-overlay::before{content:'';position:fixed;inset:0;background:url(bg-desktop.jpg) center/cover no-repeat;z-index:-1;opacity:.25}
@media(max-width:768px){.login-overlay::before{background-image:url(bg-mobile.jpg);opacity:.2}}
.login-box{background:rgba(255,255,255,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:var(--rl);padding:40px 36px;width:380px;max-width:92%;box-shadow:var(--sh-lg);border:1px solid rgba(255,255,255,.4);text-align:center}
.login-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#E0E7FF,#C7D2FE);display:inline-flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#4F46E5;margin-bottom:16px}
.login-title{font-size:22px;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--t3);margin-bottom:24px}
.login-input{width:100%;padding:12px 16px;border:1px solid rgba(0,0,0,.1);border-radius:var(--rs);background:rgba(255,255,255,.6);font-size:15px;margin-bottom:12px;text-align:center;transition:all .15s;outline:none}
.login-input:focus{border-color:var(--text);background:rgba(255,255,255,.9)}
.login-error{font-size:12px;color:var(--warn);margin-bottom:8px;min-height:18px}
.login-btn{width:100%;padding:12px;border-radius:999px;background:var(--text);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:4px}
.login-btn:hover{background:#333;transform:translateY(-1px);box-shadow:var(--sh-md)}
.logout-btn{font-size:11px;color:var(--t3);cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .15s}
.logout-btn:hover{color:var(--warn);background:var(--warn-light)}

<script>
// ═══════════════ DATA ═══════════════
const K = 'ee_wb_v2';

function defData() {
  const t = new Date().toISOString().slice(0,10);
  return {
    tasks: [],
    top3: [
      {id:'tp1',title:'',done:false,order:1},
      {id:'tp2',title:'',done:false,order:2},
      {id:'tp3',title:'',done:false,order:3}
    ],
    moods: [],
    gratitude: [],
    quickChecks: {},
    eveningNotes: [],
    yearlyKeyword: '',
    wishlist: [],
    yearGoals: [],
    monthGoals: [],
    weekActions: [],
    health:{exercise:[],water:[],body:[],diet:[],medicine:[],sleep:[],customHabits:[]},
    skinProfile:{},
    skinLogs:[],
    skinRecs:[],
    newsItems: [],
    goldData:{},
    goldAnalysis:[],
    reviewData:{},
    studyQuestions:[],
    studyNotes:[],
    spaceNotes: [],
    mealPlans: [],
    foodLogs: [],
    calendarItems: [],
    recurringTemplates: [],
    settings:{aiKey:'sk-a318ca20b2224ab1939fe684051dd2ef',aiBaseUrl:'https://api.deepseek.com/anthropic',aiModel:'deepseek-chat'},
    version:2
  };
}

let D = defData();
try{const r=localStorage.getItem(K);if(r){const p=JSON.parse(r);D={...defData(),...p,settings:{...defData().settings,...(p.settings||{})},health:{...defData().health,...(p.health||{})},skinLogs:p.skinLogs||[],skinRecs:p.skinRecs||[],skinProfile:p.skinProfile||{},goldData:p.goldData||{},goldAnalysis:p.goldAnalysis||[],reviewData:p.reviewData||{},studyQuestions:p.studyQuestions||[],studyNotes:p.studyNotes||[]}} }catch(e){}

function save(){try{localStorage.setItem(K,JSON.stringify(D));updateBadge()}catch(e){toast('存储空间不足')}}
function gid(){return 'id'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}
function nowDate(){return new Date().toISOString().slice(0,10)}

// ═══════════════ ROUTER ═══════════════
let cp='today',cm=null,spaceSearchTerm='';

function nav(p,h){
  if(cp==='gold'&&p!=='gold'){clearInterval(goldTimer);clearInterval(stockTimer)}
  if(cp==='review'&&p!=='review'){clearInterval(reviewTimer);reviewTimer=null}
  cp=p;
  document.querySelectorAll('.nav-item,.mob-nav-item').forEach(e=>e.classList.remove('active'));
  const dn=document.querySelector('.nav-item[data-p="'+p+'"]');
  const mn=document.querySelector('.mob-nav-item[data-p="'+p+'"]');
  if(dn)dn.classList.add('active');if(mn)mn.classList.add('active');
  closeMore();render(p);window.scrollTo(0,0);
  if(h)setTimeout(()=>{const e=document.getElementById(h);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},100);
}

function render(p){
  const m=document.getElementById('main-content');
  switch(p){
    case'today':m.innerHTML=pgToday();break;
    case'diet':m.innerHTML=pgDiet();break;
    case'skincare':m.innerHTML=pgSkincare();break;
    case'gold':m.innerHTML=pgGold();break;
    case'review':m.innerHTML=pgReview();break;
    case'health':m.innerHTML=pgHealth();break;
    case'study':m.innerHTML=pgStudy();break;
    case'space':m.innerHTML=pgSpace();break;
    case'search':m.innerHTML=pgSearch();break;
    case'ai':m.innerHTML=pgAI();break;
    case'settings':m.innerHTML=pgSettings();break;
    default:m.innerHTML=pgToday();
  }
  bindPg(p);updateBadge();
}

function updateBadge(){
  const b=document.getElementById('today-badge');
  if(!b)return;
  const n=D.tasks.filter(t=>!t.done).length;
  b.textContent=n;b.style.display=n>0?'inline':'none';
}

// ═══════════════ HELP ═══════════════
function helpBtn(t){return '<span class="btn-help" style="position:relative" onclick="event.stopPropagation();showHelp(event,\''+t.replace(/'/g,"\\'").replace(/"/g,'&quot;')+'\')">?</span>'}
function showHelp(e,t){
  const ex=document.querySelector('.help-pop');if(ex)ex.remove();
  const p=document.createElement('div');p.className='help-pop';p.textContent=t;
  document.body.appendChild(p);
  const r=e.target.getBoundingClientRect();
  let l=r.left,tp=r.bottom+6;
  if(l+280>window.innerWidth)l=window.innerWidth-290;
  if(tp+100>window.innerHeight)tp=r.top-p.offsetHeight-6;
  p.style.left=l+'px';p.style.top=tp+'px';
  setTimeout(()=>{const c=(ev)=>{if(!p.contains(ev.target)){p.remove();document.removeEventListener('click',c)}};document.addEventListener('click',c)},50);
}

// ═══════════════ TOAST ═══════════════
function toast(msg){const c=document.getElementById('toast-ct');const e=document.createElement('div');e.className='toast';e.textContent=msg;c.appendChild(e);setTimeout(()=>e.remove(),2500)}

// ═══════════════ MODAL ═══════════════
function modal(title,body,onSave){
  const o=document.createElement('div');o.className='modal-overlay';
  o.innerHTML='<div class="modal"><div class="modal-title">'+title+'</div><div class="modal-body">'+body+'</div><div class="modal-actions"><button class="btn btn-s" onclick="closeModal()">取消</button><button class="btn btn-p" id="modal-save">保存</button></div></div>';
  o.addEventListener('click',e=>{if(e.target===o)closeModal()});
  document.body.appendChild(o);cm={overlay:o,onSave};
  document.getElementById('modal-save').addEventListener('click',()=>{if(onSave)onSave();closeModal()});
}
function closeModal(){if(cm){cm.overlay.remove();cm=null}}
function mv(s){const e=document.querySelector(s);return e?e.value:''}
function confirm(msg,fn){
  const o=document.createElement('div');o.className='modal-overlay';
  o.innerHTML='<div class="modal" style="max-width:360px"><div class="modal-title">确认</div><p style="font-size:14px;color:var(--t2)">'+msg+'</p><div class="modal-actions"><button class="btn btn-s" onclick="this.closest(\'.modal-overlay\').remove()">取消</button><button class="btn btn-d" id="cfm-yes">确认</button></div></div>';
  o.addEventListener('click',e=>{if(e.target===o)o.remove()});
  document.body.appendChild(o);
  document.getElementById('cfm-yes').addEventListener('click',()=>{o.remove();fn()});
}

// ═══════════════ MORE MENU ═══════════════
function openMore(){
  if(document.querySelector('.more-overlay'))return;
  const items=[
    {p:'gold',l:'黄金财经',i:'<circle cx="12" cy="12" r="10"/><path d="M12 6v12"/><path d="M8.5 9h4a2.5 2.5 0 0 1 0 5H9"/>'},

    {p:'health',l:'健康打卡',i:'<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>'},
    {p:'study',l:'学习板块',i:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/>'},
    {p:'space',l:'我的空间',i:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>'},
    {p:'search',l:'搜索',i:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>'},
    {p:'ai',l:'AI帮手',i:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>'},
    {p:'settings',l:'设置',i:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'},
    {p:'settings',l:'使用说明',h:'usage',i:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>'},
    {p:'settings',l:'更新日志',h:'changelog',i:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>'}

// ═══════════════ AI CALL ═══════════════
async function aiCall(prompt){
  if(!D.settings.aiKey){toast('请先设置API Key');return null}
  let r,t;
  try{
    r=await fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+D.settings.aiKey},
      body:JSON.stringify({model:'deepseek-chat',max_tokens:800,messages:[{role:'user',content:prompt}]})
    });
    if(r.ok){const d=await r.json();return d.choices?.[0]?.message?.content||''}
    t=await r.text();
  }catch(e){}
  try{
    r=await fetch('https://api.deepseek.com/anthropic/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json','x-api-key':D.settings.aiKey,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'deepseek-chat',max_tokens:800,messages:[{role:'user',content:prompt}]})
    });
    if(r.ok){const d=await r.json();return d.content?.[0]?.text||''}
    t=await r.text();
  }catch(e){}
  toast('AI错误: '+(r?r.status:'网络')+' '+(t||'').slice(0,80));
  return null;
}
// ═══════════════ CALENDAR ═══════════════
function fmtLocalDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getWeekRange(){
  const n=new Date(),day=n.getDay(),diff=n.getDate()-day+(day===0?-6:1);
  const mon=new Date(n.getFullYear(),n.getMonth(),diff);
  const days=[];for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(d.getDate()+i);days.push(fmtLocalDate(d))}
  return {start:days[0],end:days[6],days,mon,monStr:mon.toLocaleDateString('zh-CN',{month:'long'})};
}

function ensureWeekItems(){
  const{start,end,days}=getWeekRange();
  D.recurringTemplates.forEach(rt=>{
    days.forEach((d,i)=>{
      const dayNum=i===6?0:i+1;
      if(!rt.days.includes(dayNum))return;
      const exists=D.calendarItems.find(c=>c.date===d&&c.recurringId===rt.id);
      if(!exists){D.calendarItems.push({id:gid(),title:rt.title,date:d,time:rt.time,type:rt.type,done:false,notes:'',recurringId:rt.id})}
    });
  });
}

async function genWeekSummary(){
  if(!D.settings.aiKey){toast('请先配置 API Key');return}
  const{start,end}=getWeekRange();
  const items=D.calendarItems.filter(c=>c.date>=start&&c.date<=end);
  if(items.length===0){toast('本周暂无日程');return}
  const done=items.filter(i=>i.done),undone=items.filter(i=>!i.done),inprog=items.filter(i=>!i.done&&i.notes);
  const prompt='用户本周日程。已完成：'+done.map(i=>i.date.slice(5)+' '+i.title).join('；')+'。未完成：'+undone.map(i=>i.date.slice(5)+' '+i.title).join('；')+'。请生成简短周报（50字以内）：已完成/进行中/未完成各一句话。';
  const r=await aiCall(prompt);
  const el=document.getElementById('week-summary-out');
  if(el&&r)el.innerHTML='<div class="cal-summary"><h4>本周工作小结</h4>'+esc(r)+'</div>';
}

function quickCheck(type,delta){
  const td=nowDate();if(!D.quickChecks[td])D.quickChecks[td]={water:0,medicine:false,exercise:false};

  save();render('today');
}
function toggleQuickCheck(type){
  const td=nowDate();if(!D.quickChecks[td])D.quickChecks[td]={water:0,medicine:false,exercise:false};
  D.quickChecks[td][type]=!D.quickChecks[td][type];
  if(type==='medicine'){
    if(D.quickChecks[td].medicine){D.health.medicine.unshift({id:gid(),date:td,name:'快捷打卡',taken:true})}
    else{D.health.medicine=D.health.medicine.filter(m=>!(m.date===td&&m.name==='快捷打卡'))}
  }
  if(type==='exercise'){
    if(D.quickChecks[td].exercise){D.health.exercise.unshift({id:gid(),date:td,type:'运动',duration:'未记录',intensity:3,note:'快捷打卡'})}
    else{D.health.exercise=D.health.exercise.filter(e=>!(e.date===td&&e.note==='快捷打卡'))}
  }
  save();render('today');
}

async function genMealPlan(){
  if(!D.settings.aiKey){toast('请先配置 API Key');return}
  const td=nowDate();
  const prompt='你是一位专业营养师。为减肥期间的用户推荐今日三餐。要求：\n1. 早/午/晚餐各推荐一道菜，总热量控制在1200-1500kcal\n2. 每道菜包含：菜名、约多少kcal、所需食材、简要做法（3-5步）\n3. 做法要简单，适合在家做\n4. 每道菜给出可在抖音或小红书搜索的关键词\n\n请严格按以下JSON格式回复（不要markdown代码块）：\n{"breakfast":{"name":"","cal":"","ingredients":"","steps":"","searchKeyword":""},"lunch":{"name":"","cal":"","ingredients":"","steps":"","searchKeyword":""},"dinner":{"name":"","cal":"","ingredients":"","steps":"","searchKeyword":""},"totalCal":"","note":""}';
  toast('AI 正在生成...');

  if(!r){return}
  const meal=parseJSONObj(r);
  if(!meal||!meal.breakfast){toast('AI返回格式异常，请重试');return}
  const plan={id:gid(),date:td,meals:{
    breakfast:{name:meal.breakfast.name,cal:meal.breakfast.cal,ingredients:meal.breakfast.ingredients,steps:meal.breakfast.steps,videoLink:'',searchKeyword:meal.breakfast.searchKeyword||''},
    lunch:{name:meal.lunch.name,cal:meal.lunch.cal,ingredients:meal.lunch.ingredients,steps:meal.lunch.steps,videoLink:'',searchKeyword:meal.lunch.searchKeyword||''},
    dinner:{name:meal.dinner.name,cal:meal.dinner.cal,ingredients:meal.dinner.ingredients,steps:meal.dinner.steps,videoLink:'',searchKeyword:meal.dinner.searchKeyword||''}
  },totalCal:meal.totalCal||'?',generatedAt:Date.now()};
  const idx=D.mealPlans.findIndex(x=>x.date===td);

const CORS='https://corsproxy.io/?';

async function fetchGoldPrice(){
  const doFetch=async(url,parser)=>{
    try{
      const resp=await fetch(CORS+encodeURIComponent(url),{signal:AbortSignal.timeout(5000)});
      if(!resp.ok)return null;
      const d=await resp.json();
      return parser(d);
    }catch(e){return null}
  };

  let gp=await doFetch('https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids=118.AU9999&fields=f2,f3,f12,f14',d=>{
    if(!d.data?.diff?.[0])return null;
    const x=d.data.diff[0];if(!x.f2)return null;
    return {price:x.f2.toFixed(2),buyback:(x.f2*0.997).toFixed(2),sell:(x.f2*1.003).toFixed(2),updatedAt:new Date().toLocaleString('zh-CN'),source:'东方财富·上金所AU9999'};
  });

  if(!gp){gp=await doFetch('https://vapi.danran0.cc/api/gold',d=>{
    const p=d.price||d.data?.price;if(!p)return null;
    return {price:p,buyback:d.buyback||d.data?.buyback||p,sell:d.sell||d.data?.sell||p,updatedAt:new Date().toLocaleString('zh-CN'),source:'融通金'};
  });}

  if(gp){D.goldData=D.goldData||{};D.goldData.goldPrice=gp;save();goldStatus='在线';updateGoldCard(gp)}
  else{goldStatus='离线·缓存';const cached=D.goldData?.goldPrice;if(cached)updateGoldCard(cached)}
}

function updateGoldCard(gp){
  const el=document.getElementById('card-gold');if(!el||cp!=='gold')return;
  el.outerHTML=cardGold(gp||{price:'--',buyback:'--',sell:'--',updatedAt:'部署后自动获取',source:'东方财富·上金所'});
}

function addHealthRec(type){
  let body='<div class="fg"><label class="fl">日期</label><input class="fi" type="date" id="hr-date" value="'+nowDate()+'"></div>';
  if(type==='exercise'){
    body+='<div class="fg"><label class="fl">运动项目</label><input class="fi" id="hr-type" placeholder="如：跑步"></div><div class="fg"><label class="fl">时长</label><input class="fi" id="hr-dur" placeholder="如：30分钟"></div><div class="fg"><label class="fl">强度(1-5)</label><input class="fi" type="number" min="1" max="5" id="hr-int" value="3"></div><div class="fg"><label class="fl">备注(可选)</label><input class="fi" id="hr-note"></div>';
  }else if(type==='body'){
    body+='<div class="fg"><label class="fl">状态</label><select class="fs" id="hr-status"><option value="energy">精力充沛</option><option value="normal" selected>正常</option><option value="fatigue">疲劳</option><option value="unwell">不舒服</option><option value="sick">生病</option></select></div><div class="fg"><label class="fl">备注(可选)</label><input class="fi" id="hr-note"></div>';
  }else if(type==='sleep'){
    body+='<div class="fg"><label class="fl">时长(小时)</label><input class="fi" type="number" min="0" max="24" step="0.5" id="hr-hours" value="7"></div><div class="fg"><label class="fl">质量(1-5)</label><input class="fi" type="number" min="1" max="5" id="hr-qual" value="3"></div>';
  }
  modal('记录'+({exercise:'运动',body:'身体状态',sleep:'睡眠'}[type]),body,()=>{
    const d=mv('#hr-date');if(!d)return;
    if(type==='exercise')D.health.exercise.unshift({id:gid(),date:d,type:mv('#hr-type'),duration:mv('#hr-dur'),intensity:parseInt(mv('#hr-int'))||3,note:mv('#hr-note')});
    else if(type==='body')D.health.body.unshift({id:gid(),date:d,status:mv('#hr-status'),note:mv('#hr-note')});
    else if(type==='sleep')D.health.sleep.unshift({id:gid(),date:d,hours:parseFloat(mv('#hr-hours'))||0,quality:parseInt(mv('#hr-qual'))||3});
    save();render('health');
  });
}

async function genStudyQuestions(){
  if(!D.settings.aiKey){toast('请先配置 API Key');return}
  toast('AI 正在生成10道题目...');
  const prompt='你是中级经济师考试培训老师。请生成10道单选题，覆盖《经济基础知识》核心考点（经济学基础、财政、货币金融、统计、会计、法律）。每道题格式：{"question":"题目","options":["A.选项A","B.选项B","C.选项C","D.选项D"],"answer":"A.选项A","explanation":"解析说明","knowledgePoint":"知识点名称"}。输出10个对象的JSON数组，不要markdown代码块。';
  const r=await aiCall(prompt);
  if(!r)return;
  let qs=tryParseJSON(r);
  if(!qs){
    const prompt2='上一轮输出的内容不是合法JSON数组。请严格输出纯JSON数组，不要任何额外文字，不要markdown标记。格式：[{"question":"...","options":["A...","B...","C...","D..."],"answer":"A...","explanation":"...","knowledgePoint":"..."}]';
    const r2=await aiCall(prompt2);
    if(!r2)return;
    qs=tryParseJSON(r2);
  }
  if(!qs){toast('AI返回格式异常，请重试');return}
  qs=qs.slice(0,10).map(q=>({...q,userAnswer:'',options:q.options||['A','B','C','D']}));
  const td=nowDate();const idx=D.studyQuestions.findIndex(x=>x.date===td);
  const entry={id:gid(),date:td,questions:qs};
  if(idx>=0)D.studyQuestions[idx]=entry;else D.studyQuestions.unshift(entry);
  save();render('study');toast('题目已生成');
}

function tryParseJSON(str){
  try{
    let s=str.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
    const arrMatch=s.match(/\[[\s\S]*\]/);
    if(arrMatch)s=arrMatch[0];
    const objMatch=s.match(/\{[\s\S]*\}/);
    if(!arrMatch&&objMatch){s='['+objMatch[0]+']'}
    s=s.replace(/，/g,',').replace(/"/g,'"').replace(/"/g,'"').replace(/'/g,'"');
    const r=JSON.parse(s);
    return Array.isArray(r)?r:[r];
  }catch(e){return null}
}

function parseJSONObj(str){
  try{
    let s=str.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
    const m=s.match(/\{[\s\S]*\}/);
    if(m)s=m[0];
    s=s.replace(/，/g,',').replace(/"/g,'"').replace(/"/g,'"').replace(/'/g,'"');
    return JSON.parse(s);
  }catch(e){return null}
}

  D.mealPlans.forEach(p=>{if(p.date.includes(q)||(p.meals.breakfast.name||'').toLowerCase().includes(q)||(p.meals.lunch.name||'').toLowerCase().includes(q)||(p.meals.dinner.name||'').toLowerCase().includes(q))results.push({type:'饮食方案',title:p.date+' 三餐',snip:p.meals.breakfast.name+' / '+p.meals.lunch.name+' / '+p.meals.dinner.name,page:'diet',id:p.id})});

  if(D.reviewData&&D.reviewData.aiReview&&D.reviewData.aiReview.toLowerCase().includes(q))results.push({type:'市场复盘',title:'A股复盘分析',snip:D.reviewData.aiReview.slice(0,80),page:'review',id:'review'});
  D.health.exercise.forEach(e=>{if(e.type.toLowerCase().includes(q))results.push({type:'运动记录',title:e.type,snip:e.date+' · '+e.duration,page:'health',id:e.id})});
  if(D.health.aiTrend&&D.health.aiTrend.toLowerCase().includes(q))results.push({type:'健康趋势',title:'温和趋势提醒',snip:D.health.aiTrend.slice(0,80),page:'health',id:'health'});
  D.spaceNotes.forEach(n=>{if(n.title.toLowerCase().includes(q)||n.content.toLowerCase().includes(q))results.push({type:'我的空间',title:n.title,snip:n.content.slice(0,80),page:'space',id:n.id})});
  D.gratitude.forEach(g=>{if(g.content.toLowerCase().includes(q))results.push({type:'感恩记录',title:g.content.slice(0,60),snip:g.date,page:'today',id:g.id})});
  if(results.length===0)c.innerHTML='<div class="empty"><div class="empty-title">无匹配结果</div></div>';
  else c.innerHTML=results.map(r=>'<div class="card" style="margin-bottom:6px;cursor:pointer;padding:12px 16px" onclick="nav(\''+r.page+'\')"><div style="font-size:10px;color:var(--accent)">'+r.type+'</div><div style="font-weight:500;font-size:14px">'+esc(r.title)+'</div>'+(r.snip?'<div style="font-size:12px;color:var(--t3)">'+esc(r.snip)+'</div>':'')+'</div>').join('');
}

// ═══════════════ PAGE: AI ═══════════════
function pgAI(){
  const hasKey=!!(D.settings.aiKey&&D.settings.aiKey.trim());
  return '<div class="pg-hd"><div><div class="page-title">AI 帮手</div><div class="pg-sub">资讯摘要、运维辅助、作息建议 '+helpBtn('使用 DeepSeek API。在设置中填入 Key 后可用。不自动上传工作数据。')+'</div></div></div>'+
  (!hasKey?'<div class="card" style="text-align:center;padding:32px"><div style="font-size:14px;color:var(--t2);margin-bottom:12px">尚未配置 API Key</div><button class="btn btn-p" onclick="nav(\'settings\')">前往设置</button></div>':
  '<div class="chat-wrap"><div class="chat-msgs" id="chat-msgs"><div class="chat-msg asst"><div class="chat-bub">你好，我是 AI 帮手。可以帮你：\n· 解读财经资讯\n· 运维问题排查建议\n· 制定作息和健康计划\n\n请直接输入问题。</div></div></div><div class="chat-row"><input class="chat-inp" id="chat-inp" placeholder="输入问题..." onkeydown="if(event.key===\'Enter\')sendChat()"><button class="btn btn-p" onclick="sendChat()">发送</button></div></div>');
}

async function sendChat(){
  const inp=document.getElementById('chat-inp');const m=inp?.value?.trim();if(!m)return;
  if(!D.settings.aiKey){toast('请先配置 API Key');return}
  const ms=document.getElementById('chat-msgs');ms.innerHTML+='<div class="chat-msg user"><div class="chat-bub">'+esc(m)+'</div></div>';inp.value='';ms.scrollTop=ms.scrollHeight;
  const ld=document.createElement('div');ld.className='chat-msg asst';ld.innerHTML='<div class="chat-bub" style="color:var(--t3)">思考中...</div>';ms.appendChild(ld);ms.scrollTop=ms.scrollHeight;
  const r=await aiCall(m);ld.remove();
  ms.innerHTML+='<div class="chat-msg asst"><div class="chat-bub">'+esc(r||'请求失败，请重试')+'</div></div>';ms.scrollTop=ms.scrollHeight;
}

  return '<div class="pg-hd"><div><div class="page-title">设置与数据</div><div class="pg-sub">AI配置、数据管理、使用说明 '+helpBtn('管理所有设置。定期导出备份。同步状态如实展示。')+'</div></div></div>'+

  '<div class="set-sec" id="usage"><div class="set-sec-title">使用说明</div><div style="font-size:13px;color:var(--t2);line-height:1.8">'+

function saveSet(){D.settings.aiKey=document.getElementById('set-key')?.value||'';D.settings.aiBaseUrl=document.getElementById('set-url')?.value||'';save();toast('已保存')}
function exportData(){const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='ee_wb_'+nowDate()+'.json';a.click();URL.revokeObjectURL(u);toast('已导出')}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){try{const d=JSON.parse(ev.target.result);D={...defData(),...d,settings:{...defData().settings,...(d.settings||{})},health:{...defData().health,...(d.health||{})}};save();toast('已导入');nav(cp)}catch(err){toast('无效文件')}};r.readAsText(f);e.target.value=''}
function clearAll(){D=defData();save();toast('已清除');nav('today')}

// ═══════════════ BIND ═══════════════
function bindPg(p){
  if(p==='search'){const inp=document.getElementById('global-search');if(inp){setTimeout(()=>inp.focus(),100);doSearch()}}
  if(p==='ai'){const inp=document.getElementById('chat-inp');if(inp)setTimeout(()=>inp.focus(),100)}
}

// ═══════════════ LOGIN ═══════════════
const AUTH_KEY='ee_wb_auth';
const DEFAULT_USER='ee';
const DEFAULT_PASS='ee2026';

function doLogin(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pass').value.trim();
  const err=document.getElementById('login-error');
  if(u!==DEFAULT_USER||p!==DEFAULT_PASS){err.textContent='账号或密码错误';return}
  localStorage.setItem(AUTH_KEY,JSON.stringify({user:u,ts:Date.now()}));
  document.getElementById('login-screen').style.display='none';
  initApp();
}

function doLogout(){
  localStorage.removeItem(AUTH_KEY);
  location.reload();
}

function isLoggedIn(){
  try{const d=JSON.parse(localStorage.getItem(AUTH_KEY));return d&&d.user===DEFAULT_USER}catch(e){return false}
}

// ═══════════════ INIT ═══════════════
function initApp(){
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(cm){closeModal();return}if(document.querySelector('.more-overlay')){closeMore();return}}});
  document.getElementById('topbar-date').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  nav('today');
}

if(isLoggedIn()){
  document.getElementById('login-screen').style.display='none';
  initApp();
}

</script>
